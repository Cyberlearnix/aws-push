spring.application.name=student-service

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/cyberlearnixdb
spring.datasource.username=cyberlearnix
spring.datasource.password=cyberlearnix123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.
jwt.expiration=86400000

# Server Configuration
server.port=8082

# Logging
logging.level.com.student.service=DEBUG
logging.level.org.springframework.cloud=INFO
logging.level.com.netflix=INFO

# Remove Eureka Client Configuration since we're not using it
# eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
# eureka.instance.prefer-ip-address=true
