# Server Configuration
server.port=8082

# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    disable-swagger-default-url: true
  show-actuator: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

# Swagger security configuration
springdoc.swagger-ui.csrf.enabled: false

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/cyberlearnixdb
spring.datasource.username=cyberlearnix
spring.datasource.password=cyberlearnix123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
# WARNING: 'create' will DROP and RECREATE all tables on startup (data will be lost)
# Change to 'update' after successful migration
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
# JWT Configuration
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000

# Logging Configuration
logging.level.root=INFO
logging.level.com.student.service.security=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO

# Log JWT token in headers (masked for security)
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Log all HTTP requests
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG

# Enable request/response logging
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG
logging.level.org.springframework.web.client.RestTemplate=DEBUG

# JWT Debugging
logging.level.io.jsonwebtoken=DEBUG
logging.level.org.springframework.security.oauth2.jwt=DEBUG

# SQL logging
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Server Configuration
server.port=8082

# Logging
logging.level.com.student.service=DEBUG
logging.level.org.springframework.cloud=INFO
logging.level.com.netflix=INFO

