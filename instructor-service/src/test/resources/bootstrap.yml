# Test configuration for JWT (same secret as main config)
jwt:
  secret: 
  expiration-ms: 3600000
  access-expiry-seconds: 3600

# Minimal Spring configuration for tests
spring:
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false

# Disable external services for tests
eureka:
  client:
    enabled: false

management:
  endpoints:
    enabled-by-default: false
