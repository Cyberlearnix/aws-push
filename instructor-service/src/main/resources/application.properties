spring.application.name=instructor-service

# Database (placeholder; replace with actual if needed)
spring.datasource.url=jdbc:postgresql://localhost:5432/cyberlearnixdb
spring.datasource.username=cyberlearnix
spring.datasource.password=cyberlearnix123
spring.datasource.driver-cLass-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server
server.port=8083

# Eureka Client
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${random.value}

# Actuator
management.endpoints.web.exposure.include=health,info

# JWT
jwt.secret=CyberLearnixSuperSecureJWTKeyChangeThis
# Redis (for local dev: use localhost; if Redis is in Docker Compose, change host to 'redis')
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.timeout=2000ms