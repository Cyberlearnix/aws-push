spring.application.name=instructor-service

# Allow bean definition overriding
spring.main.allow-bean-definition-overriding=true

# Database (placeholder; replace with actual if needed)
spring.datasource.url=jdbc:postgresql://localhost:5432/cyberlearnixdb
spring.datasource.username=cyberlearnix
spring.datasource.password=cyberlearnix123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Server Configuration
server.port=8083
server.servlet.context-path=/

# API Paths
api.base-path=/api/instructors

# Remove Eureka Client configuration since we're not using it
# eureka.client.register-with-eureka=true
# eureka.client.fetch-registry=true
# eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
# eureka.instance.prefer-ip-address=true
# eureka.instance.instance-id=${spring.application.name}:${random.value}

# SpringDoc OpenAPI Configuration
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    disable-swagger-default-url: true
  show-actuator: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

# Swagger security configuration
springdoc.swagger-ui.csrf.enabled: false

# JWT
jwt.secret=${JWT_SECRET:}
jwt.expiration-ms=86400000

# Google Drive Configuration
google.drive.folder.id=1bYL_IND-NxoUS9U1IyE38HJI7Ip0V8bS
google.drive.credentials.path=classpath:credentials.json

# File Upload Configuration
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
file.upload-dir=./uploads
file.max-size=100MB
file.allowed-extensions=.jpg,.jpeg,.png,.gif,.mp4,.mov,.avi

# User Service Configuration
# Update the URL below with the actual user-service URL if different
user-service.url=http://localhost:8080

# Feign Client Configuration
feign.client.config.default.connectTimeout=5000
feign.client.config.default.readTimeout=5000
feign.compression.request.enabled=true

# Circuit Breaker Configuration for user-service
resilience4j.circuitbreaker.instances.user-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.user-service.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.user-service.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.user-service.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.instances.user-service.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.user-service.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.user-service.sliding-window-size=10
feign.compression.response.enabled=true
