spring:
  application:
    name: api-gateway

server:
  port: 8080

# Production: use direct service routing (no Eureka)
spring:
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        - id: user-service
          uri: http://user-service:8081
          predicates:
            - Path=/api/users/**, /api/email-auth/**, /api/admin/**
          filters:
            - RewritePath=/api/(?<segment>.*), /api/$\{segment}

        - id: student-service
          uri: http://student-service:8082
          predicates:
            - Path=/api/students/**
          filters:
            - RewritePath=/api/(?<segment>.*), /api/$\{segment}

        - id: instructor-service
          uri: http://instructor-service:8083
          predicates:
            - Path=/api/instructors/**
          filters:
            - RewritePath=/api/(?<segment>.*), /api/$\{segment}

        - id: course-service
          uri: http://course-service:8085
          predicates:
            - Path=/api/courses/**
          filters:
            - RewritePath=/api/(?<segment>.*), /api/$\{segment}

        - id: order-service
          uri: http://order-service:8084
          predicates:
            - Path=/api/orders/**
          filters:
            - RewritePath=/api/(?<segment>.*), /api/$\{segment}

        - id: payment-service
          uri: http://payment-service:8086
          predicates:
            - Path=/api/payments/**
          filters:
            - RewritePath=/api/(?<segment>.*), /api/$\{segment}

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin, RETAIN_UNIQUE

# Remove Eureka client configuration since we're not using it
# eureka:
#   client:
#     service-url:
#       defaultZone: http://eureka-server:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    health:
      show-details: when_authorized
