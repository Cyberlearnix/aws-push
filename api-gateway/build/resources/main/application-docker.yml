server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
      routes:
        # User Service Routes
        - id: user-service
          uri: http://user-service:8081
          predicates:
            - Path=/api/users/**, /api/email-auth/**
          filters:
            - name: CircuitBreaker
              args:
                name: userService
                fallbackUri: forward:/fallback/user-fallback
        
        # Student Service
        - id: student-service
          uri: http://student-service:8082
          predicates:
            - Path=/api/students/**
          filters:
            - StripPrefix=1
            - name: CircuitBreaker
              args:
                name: studentService
                fallbackUri: forward:/fallback/fallback
        
        # Instructor Service
        - id: instructor-service
          uri: http://instructor-service:8083
          predicates:
            - Path=/api/instructors/**
          filters:
            - StripPrefix=1
            - name: CircuitBreaker
              args:
                name: instructorService
                fallbackUri: forward:/fallback/fallback
        
        # Course Service
        - id: course-service
          uri: http://course-service:8084
          predicates:
            - Path=/api/courses/**
          filters:
            - StripPrefix=1
            - name: CircuitBreaker
              args:
                name: courseService
                fallbackUri: forward:/fallback/fallback
        
        # Order Service
        - id: order-service
          uri: http://order-service:8085
          predicates:
            - Path=/api/orders/**
          filters:
            - StripPrefix=1
            - name: CircuitBreaker
              args:
                name: orderService
                fallbackUri: forward:/fallback/fallback
        
        # Payment Service
        - id: payment-service
          uri: http://payment-service:8086
          predicates:
            - Path=/api/payments/**
          filters:
            - StripPrefix=1
            - name: CircuitBreaker
              args:
                name: paymentService
                fallbackUri: forward:/fallback/fallback

# Circuit Breaker Configuration
resilience4j.circuitbreaker:
  configs:
    default:
      registerHealthIndicator: true
      slidingWindowSize: 10
      permittedNumberOfCallsInHalfOpenState: 3
      slidingWindowType: COUNT_BASED
      minimumNumberOfCalls: 5
      waitDurationInOpenState: 5s
      failureRateThreshold: 50

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

# Logging Configuration
logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: DEBUG
    org.springframework.web.reactive: DEBUG
    org.springframework.cloud.circuitbreaker: DEBUG
