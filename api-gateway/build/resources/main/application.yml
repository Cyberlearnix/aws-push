server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false  # Disable Eureka service discovery
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/**, /api/email-auth/**, /api/admin/**
          filters:
            - RewritePath=/api/(?<segment>.*), /api/$\{segment}

        - id: student-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/students/**
          filters:
            - RewritePath=/api/(?<segment>.*), /api/$\{segment}

        - id: instructor-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/instructors/**
          filters:
            - RewritePath=/api/(?<segment>.*), /api/$\{segment}

        - id: course-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/courses/**
          filters:
            - RewritePath=/api/(?<segment>.*), /api/$\{segment}

        - id: order-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/orders/**
          filters:
            - RewritePath=/api/(?<segment>.*), /api/$\{segment}

        - id: payment-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/payments/**
          filters:
            - RewritePath=/api/(?<segment>.*), /api/$\{segment}

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin, RETAIN_UNIQUE

  redis:
    host: localhost
    port: 6379

# Remove Eureka client configuration since we're not using it
# eureka:
#   client:
#     service-url:
#       defaultZone: http://localhost:8761/eureka/
#   instance:
#     prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: DEBUG
