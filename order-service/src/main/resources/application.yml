server:
  port: 8085

spring:
  application:
    name: order-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cyberlearnixdb}
    username: ${SPRING_DATASOURCE_USERNAME:cyberlearnix}
    password: ${SPRING_DATASOURCE_PASSWORD:cyberlearnix123}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE:http://localhost:8761/eureka/}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# Feign clients configuration
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 10000

# Service URLs for Feign clients
user-service:
  url: ${USER_SERVICE_URL:http://localhost:8081}

payment-service:
  url: ${PAYMENT_SERVICE_URL:http://localhost:8086}

course-service:
  url: ${COURSE_SERVICE_URL:http://localhost:8083}