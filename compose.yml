version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: cyberlearnixdb
      POSTGRES_USER: cyberlearnix
      POSTGRES_PASSWORD: cyberlearnix123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cyberlms

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - cyberlms

  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    container_name: eureka-server
    environment:
      SPRING_APPLICATION_NAME: eureka-server
      SERVER_PORT: 8761
    depends_on:
      - postgres
    networks:
      - cyberlms

  config-server:
    build:
      context: .
      dockerfile: config-server/Dockerfile
    container_name: config-server
    environment:
      SPRING_APPLICATION_NAME: config-server
      SERVER_PORT: 8888
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
    networks:
      - cyberlms

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      SPRING_APPLICATION_NAME: api-gateway
      SERVER_PORT: 8080
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_PROFILES_ACTIVE: local
    depends_on:
      - eureka-server
      - config-server
    networks:
      - cyberlms

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: user-service
    environment:
      SPRING_APPLICATION_NAME: user-service
      SERVER_PORT: 8081
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cyberlearnixdb
      SPRING_DATASOURCE_USERNAME: cyberlearnix
      SPRING_DATASOURCE_PASSWORD: cyberlearnix123
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
    depends_on:
      - eureka-server
      - postgres
      - redis
    networks:
      - cyberlms

  student-service:
    build:
      context: .
      dockerfile: student_service/Dockerfile
    container_name: student-service
    environment:
      SPRING_APPLICATION_NAME: student-service
      SERVER_PORT: 8082
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cyberlearnixdb
      SPRING_DATASOURCE_USERNAME: cyberlearnix
      SPRING_DATASOURCE_PASSWORD: cyberlearnix123
    depends_on:
      - eureka-server
      - postgres
    networks:
      - cyberlms

  instructor-service:
    build:
      context: .
      dockerfile: instructor-service/Dockerfile
    container_name: instructor-service
    environment:
      SPRING_APPLICATION_NAME: instructor-service
      SERVER_PORT: 8083
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cyberlearnixdb
      SPRING_DATASOURCE_USERNAME: cyberlearnix
      SPRING_DATASOURCE_PASSWORD: cyberlearnix123
    depends_on:
      - eureka-server
      - postgres
    networks:
      - cyberlms

  course-service:
    build:
      context: .
      dockerfile: course-service/Dockerfile
    container_name: course-service
    environment:
      SPRING_APPLICATION_NAME: course-service
      SERVER_PORT: 8084
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
    networks:
      - cyberlms

  order-service:
    build:
      context: .
      dockerfile: order-service/Dockerfile
    container_name: order-service
    environment:
      SPRING_APPLICATION_NAME: order-service
      SERVER_PORT: 8085
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cyberlearnixdb
      SPRING_DATASOURCE_USERNAME: cyberlearnix
      SPRING_DATASOURCE_PASSWORD: cyberlearnix123
      USER_SERVICE_URL: http://user-service:8081
      PAYMENT_SERVICE_URL: http://payment-service:8086
      COURSE_SERVICE_URL: http://course-service:8084
    depends_on:
      - eureka-server
      - postgres
    networks:
      - cyberlms

  payment-service:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    container_name: payment-service
    environment:
      SPRING_APPLICATION_NAME: payment-service
      SERVER_PORT: 8086
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-server:8761/eureka/
    depends_on:
      - eureka-server
    networks:
      - cyberlms

networks:
  cyberlms:
    driver: bridge

volumes:
  postgres_data:
