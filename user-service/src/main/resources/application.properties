# -------------------------
# Application Identification
# -------------------------
spring.application.name=user-service
server.port=8081

# -------------------------
# Eureka Client Configuration
# -------------------------
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Enable health check handler (optional but recommended)
eureka.client.healthcheck.enabled=true

# Instance configuration
eureka.instance.instance-id=${spring.application.name}:${random.value}
eureka.instance.prefer-ip-address=true

# Lease configuration
eureka.instance.lease-renewal-interval-in-seconds=5
eureka.instance.lease-expiration-duration-in-seconds=10

# Health check URL
eureka.instance.health-check-url-path=/actuator/health

# Enable debug logging for Eureka client
logging.level.com.netflix.discovery=DEBUG
logging.level.com.netflix.eureka=DEBUG

# -------------------------
# Database Configuration
# -------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/cyberlearnixdb
spring.datasource.username=cyberlearnix
spring.datasource.password=cyberlearnix123
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# -------------------------
# Flyway Migrations
# -------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# -------------------------
# Redis Configuration
spring.redis.host=${SPRING_REDIS_HOST:localhost}
spring.redis.port=${SPRING_REDIS_PORT:6379}
spring.redis.timeout=5000

# -------------------------
# JWT Settings
# -------------------------
jwt.secret=CyberLearnixSuperSecureJWTKeyChangeThis
jwt.expiration-ms=3600000           # 1 hour in ms (access token)
jwt.access-expiry-seconds=3600      # for including in JSON response

# -------------------------
# Password Login Lockout Policy
# -------------------------
auth.lockout.max-attempts=5
 auth.lockout.duration-minutes=15

# -------------------------
# Mail Configuration
# -------------------------
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=cyberlearnixprivatelimited@gmail.com
spring.mail.password=wxhqcbzyjfwhnoic
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.protocol=smtp

# -------------------------
# Logging Configuration
# -------------------------
# Root logging level
logging.level.root=INFO

# Spring Security debugging
logging.level.org.springframework.security=DEBUG

# Application-specific logging
logging.level.com.userservice.userservice=DEBUG
logging.level.com.userservice.userservice.service=INFO
logging.level.com.userservice.userservice.controller=INFO
logging.level.com.userservice.userservice.security=INFO

# Database and JPA logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.springframework.orm.jpa=DEBUG

# Redis logging
logging.level.org.springframework.data.redis=DEBUG

# JWT and authentication flow
logging.level.io.jsonwebtoken=DEBUG

# Request/Response logging
logging.level.org.springframework.web=INFO
logging.level.org.apache.coyote.http11=INFO

# Console output pattern with colors and request IDs
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx

# File logging (optional)
logging.file.name=logs/user-service.log
logging.file.max-size=10MB
logging.file.max-history=30

# -------------------------
# Token Expiry (general use)
# -------------------------
token.expiry.hours=1

# Note: Removed conflicting server.port=9090 and duplicate eureka.client.service-url to avoid port mismatch and duplicate configuration

# -------------------------
# Redis (OTP & Session Cache)
# -------------------------
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:${SPRING_REDIS_HOST:localhost}}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:${SPRING_REDIS_PORT:6379}}
spring.data.redis.timeout=2000ms
spring.cache.type=none

# -------------------------
# Actuator Health (expose Redis health)
# -------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.redis.enabled=true
